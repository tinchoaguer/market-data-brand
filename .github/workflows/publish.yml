name: Publish Package to npm (OIDC)

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.release.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build (if present)
        run: npm run build --if-present

      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_no_v="${RELEASE_TAG#v}"
          if [ "$pkg_version" != "$tag_no_v" ]; then
            echo "Package version ($pkg_version) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Request OIDC ID token
        id: idtoken
        run: |
          # ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN are provided by the runner
          audience="${{ secrets.TOKEN_EXCHANGE_AUDIENCE || 'npm-token-exchange' }}"
          id_token=$(curl -s -X GET "${ACTIONS_ID_TOKEN_REQUEST_URL}?audience=${audience}" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}")
          echo "token=$id_token" >> $GITHUB_OUTPUT

      - name: Exchange ID token for ephemeral npm token
        id: exchange
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.token }}
          TOKEN_EXCHANGE_URL: ${{ secrets.TOKEN_EXCHANGE_URL }}
        run: |
          if [ -z "$TOKEN_EXCHANGE_URL" ]; then
            echo "ERROR: TOKEN_EXCHANGE_URL secret is not set"
            exit 1
          fi
          resp=$(curl -s -X POST "$TOKEN_EXCHANGE_URL" -H "Content-Type: application/json" -d "{\"id_token\":\"$ID_TOKEN\",\"repo\":\"${{ github.repository }}\",\"ref\":\"${{ github.ref }}\"}")
          npm_token=$(echo "$resp" | jq -r .npm_token)
          if [ -z "$npm_token" ] || [ "$npm_token" = "null" ]; then
            echo "Token exchange failed: $resp"
            exit 1
          fi
          echo "token=$npm_token" >> $GITHUB_OUTPUT

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ steps.exchange.outputs.token }}" > ~/.npmrc

      - name: Publish to npm
        run: npm publish --access public
